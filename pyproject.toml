[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karisdb-cli"
version = "0.1.0"
description = "Python CLI frontend for the KarisDB Go Core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
karisdb = "karisdb.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
